[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "py_math_tools"
version = "0.0.1"
description = "Tier 3 numpy-backed math implementation layer for pyFoundationTools (quaternions, spatial/spherical math, waveforms, polynomials, trajectory generation)."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
authors = [
  {name = "Nicholas Bergantz", email = "nicholas.bergantz@gmail.com"}
]
keywords = ["my_package", "python", "package"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
license = {text = "MIT"}
# Runtime dependencies — NAMES ONLY, never version-pinned (BKM: only the application
# layer pins; module-level pins cause dependency conflicts). Put any version pins,
# tag-pins, or git-based pointers in requirements*.txt — NEVER here (git URLs in
# pyproject are a module-deployment disaster). e.g.:
#   dependencies = ["requests"]
dependencies = [
    "pyFoundationTools",
    "numpy",
    "scipy",
    "numpy-quaternion",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "build",
    "bump2version",
    "mypy",
    "ty",
    "twine",
]

[project.urls]

bugs = "https://github.com/kopecn/py_math_tools/issues"
changelog = "https://github.com/kopecn/py_math_tools/blob/prod/HISTORY.md"
homepage = "https://github.com/kopecn/py_math_tools"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
testpaths = ["tests/*"]
python_functions = ["test*"]
python_files = ["test*.py"]
# src/ layout: let pytest import the package without an install (so `make test` and a
# bare `pytest` work on a fresh checkout).
pythonpath = ["src"]

# Path resolution: the Makefile scopes quality targets via PY_* vars (.env sets
# PY_SRC=src for this src/ layout). The src/files config below is the fallback that
# makes a bare `ruff check .` / `mypy .` (no path args) and IDE integrations resolve
# the same scope. The Makefile is byte-identical across halves.
[tool.ruff]
target-version = "py310"  # support floor; default dev interpreter is 3.13
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["D301"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# Multi-repo co-development: local editable sibling repos and any git-based pointers
# go in requirements-local.txt (NEVER in pyproject — git URLs / path overrides here
# are a module-deployment disaster). `make uv-sync-local` installs that overlay on top
# of the normal env; it is gitignored and never read by CI/release.

# scipy ships no inline type stubs and the third-party `scipy-stubs` package lags the
# pinned scipy release (waveformDsp.md's DSP mixins are thin scipy wrappers per
# mathToolsArchitecture.md's dependency policy, so every scipy submodule they touch
# hits this). Narrowly scoped to `scipy.*` only -- every other third-party import stays
# strict/unignored.
[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true