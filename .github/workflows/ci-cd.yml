name: CI-CD

on:
  pull_request:
    branches:
      - dev
      - prod
    types:
      - opened
      - synchronize
      - reopened

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Python versions
        run: make uv-bootstrap-pythons

      - name: Bootstrap development environment
        run: make uv-bootstrap

      - name: Run quality checks
        run: make uv-fullCheck

  compatibility:
    name: Python Compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install configured Python versions
        run: make uv-bootstrap-pythons

      - name: Run compatibility matrix
        run: make uv-test-all